<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5, #f8e8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 15px 45px rgba(80, 30, 80, 0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #7b285f;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #b84d91;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #9b3978;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7f2d62;
        }

        .message {
            margin-top: 25px;
            padding: 22px;
            border-radius: 14px;
            background: #fff5fa;
            color: #3d2936;
            line-height: 1.7;
            white-space: pre-wrap;
            border: 1px solid #f0cadd;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>💌 A Special Message</h1>

        <form id="messageForm">

            <label for="name">Enter your Name:</label>
            <input id="name" type="text" required>

            <label for="f_name">Enter your Father Name:</label>
            <input id="f_name" type="text" required>

            <label for="cast">Write your Cast:</label>
            <input id="cast" type="text" required>

            <button type="submit">Submit ❤️</button>

        </form>

        <div id="message" class="message" style="display:none;"></div>

    </div>

    <script>
        document.getElementById("messageForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const cast = document.getElementById("cast").value.toLowerCase();

            const message = `Dear pyari larki:

You are genuinely one of the most special people in my life. Your presence brings a kind of happiness and comfort that is hard to put into words. I truly appreciate every conversation, every laugh, and every little moment we share.

No matter where life takes us, I hope you always remember how much you are valued and appreciated. You have a beautiful place in my heart, and I’m grateful to have someone like you in my life.

Thank you for being you, for making ordinary moments feel meaningful, and for always being someone I can appreciate and care about. I hope life gives you countless reasons to smile, and I’ll always wish the very best for you. ❤️

یہ مجھے چین کیوں نہیں پڑتا

ایک ہی شخص ہے جہان میں کیا`;

            document.getElementById("message").textContent = message;
            document.getElementById("message").style.display = "block";
        });
    </script>

</body>
</html>
